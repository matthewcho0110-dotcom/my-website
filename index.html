<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 첫 홈페이지</title>
    <style>
        body {background-color: #f5f5f5;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 18px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #4caf50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        body {
            text-align: center;
            padding: 40px 16px;
        }
        .skills{
            justify-content: center;
        }
        .card a {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 8px;
            background: #e8f5e9;
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }
        .card a:hover {
            background: #c8e6c9;
        }
    </style>
</head>
<body>
    <h1>안녕하세요</h1>
    <p id="message">내가 만든 첫 홈페이지입니다.</p>
    <button id="myButton">눌러보세요</button>

    <section class="card">
        <h2>소개</h2>
        <p>웹 개발을 배우고 있는 초보 개발자입니다.</p>
    </section>

    <section class="card">
        <h2>기술 스택</h2>
        <ul class=""skills">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </section>

    <section class="card">
        <h2>프로젝트</h2>
        <p>
            <a href="https://matthewcho0110-dotcom.github.io/my-website/" target="_blank">
                내 첫 홈페이지
            </a>
        </p>
    </section>

    <script>
        const button = document.getElementById("myButton");
        const message = document.getElementById("message");

        const originalText = "내가 만든 첫 홈페이지입니다.";
        const clickedText = "버튼을 눌렀어요!";

        let isClicked = false;

        button.addEventListener("click", function () {
            isClicked = !isClicked;

            message.textContent = isClicked ? clickedText : originalText;
            button.style.backgroundColor = isClicked ? "#9e9e9e" : "#4caf50";
            button.textContent = isClicked ? "되돌리기" : "눌러보세요";
        });
    </script>
</body>
</html>
